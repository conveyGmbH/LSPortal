<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link href="account.css" rel="stylesheet" />
    <script type="text/javascript" src="accountService.js"></script>
    <script type="text/javascript" src="accountController.js"></script>
    <script type="text/javascript" src="account.js"></script>
</head>
<body class="win-type-body">
    <div class="account fragment">
        <div id="accountController" class="data-container">
            <section aria-label="Main content" role="main" class="animationElement">
	            <div class="wait-circle-container" data-win-bind="style.display: showWaitCircle Binding.Converter.toDisplay">
		            <progress class="win-ring win-large wait-circle"></progress>
	            </div>
                <div class="contentarea win-type-body">
                    <div class="header-separator"></div>
                    <div class="content-header">
	                    <div class="half-circle half-circle-textcolor">&nbsp;</div>
	                    <div class="content-header-line win-type-caption">
		                    <span class="id-field"></span>
		                    <span class="caption-field"
		                          data-win-res="{textContent: 'account.title'}"></span>
		                    <span class="date-field"></span>
	                    </div>
                    </div>
                    <div class="content-record acc-page" data-win-bind="style.display: showWaitCircle Binding.Converter.toDisplayNone">
                        <!-- Identität -->
                        <div class="acc-ident">
                            <span class="acc-avatar" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/></svg>
                            </span>
                            <div class="acc-ident-text">
                                <div class="acc-who" data-win-bind="textContent: dataLogin.Login"></div>
                                <div class="acc-sub" data-win-bind="textContent: eventName"></div>
                            </div>
                        </div>
                        <div class="acc-message"
                             data-win-bind="style.display: messageText Binding.Converter.toDisplay">
                            <span data-win-bind="textContent: messageText"></span>
                        </div>
                        <div class="field_line"
                             data-win-bind="style.display: progress.show Binding.Converter.toDisplay">
                            <span class="label win-type-caption portrait_only"
                                  data-win-res="{textContent: 'account.progress'}"></span>
                            <span class="label landscape_only"
                                  data-win-res="{textContent: 'account.progress'}"></span>
                            <progress class="progress_field win-progress-bar"
                                      data-win-bind="value: progress.percent"
                                      min="0" max="100"></progress>
                            <span class="large_field"
                                  data-win-bind="textContent: progress.text"></span>
                        </div>

                        <!-- Einstellungen -->
                        <h3 class="acc-grp" data-win-res="{textContent: 'account.preferences'}"></h3>
                        <div class="acc-sec">
                            <div class="acc-row"
                                 data-win-bind="style.display: showLanguages Binding.Converter.toDisplay">
                                <div class="acc-row-text">
                                    <label class="acc-row-title" for="InitSprache" data-win-res="{textContent: 'account.language'}"></label>
                                    <p class="acc-row-desc" data-win-res="{textContent: 'account.languageDesc'}"></p>
                                </div>
                                <div class="acc-select">
                                    <select id="InitSprache"
                                            class="win-dropdown"
                                            data-win-control="WinJS.UI.Repeater"
                                            data-win-bind="value: dataLogin.INITSpracheID Binding.Mode.twoway">
                                        <option data-win-bind="value: INITSpracheID; textContent: TITLE"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="acc-row">
                                <div class="acc-row-text">
                                    <span class="acc-row-title" data-win-res="{textContent: 'account.doEdit'}"></span>
                                    <p class="acc-row-desc" data-win-res="{textContent: 'account.doEditDesc'}"></p>
                                </div>
                                <div class="toggle-switch-parent">
                                    <div id="doEdit"
                                         data-win-control="WinJS.UI.ToggleSwitch"
                                         data-win-bind="winControl.checked: doEdit; winControl.labelOn: generalData.on; winControl.labelOff: generalData.off"
                                         onchange="AppBar.handleEvent('change', 'clickDoEdit', event)">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Konto ändern (nur bei doEdit) -->
                        <div class="acc-sec acc-edit" data-win-bind="style.display: doEdit Binding.Converter.toDisplay">
                            <div class="acc-row">
                                <label class="acc-row-title" data-win-res="{textContent: 'account.login'}"></label>
                                <input class="win-textbox acc-input" type="text" autocomplete="username"
                                       data-win-bind="value: dataLogin.Login Binding.Mode.twoway" />
                            </div>
                            <div class="acc-row">
                                <label class="acc-row-title" data-win-res="{textContent: 'account.password'}"></label>
                                <input class="win-textbox acc-input" type="password" autocomplete="current-password"
                                       data-win-bind="value: dataLogin.Password Binding.Mode.twoway" />
                            </div>
                            <div class="acc-row"
                                 data-win-bind="style.display: showServerList Binding.Converter.toDisplay">
                                <div class="acc-row-text">
                                    <label class="acc-row-title" for="GlobalUserServer" data-win-res="{textContent: 'account.serverlist'}"></label>
                                    <p class="acc-row-desc" data-win-res="{textContent: 'account.serverDesc'}"></p>
                                </div>
                                <div class="acc-select">
                                    <select id="GlobalUserServer"
                                            class="win-dropdown"
                                            data-win-control="WinJS.UI.Repeater"
                                            data-win-bind="value: dataLogin.LocationID Binding.Mode.twoway">
                                        <option data-win-bind="value: LocationID; textContent: LocationName"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="acc-row acc-row--full">
                                <label class="checkbox">
                                    <input type="checkbox" class="win-checkbox checkbox"
                                           data-win-bind="checked: dataLogin.PrivacyPolicyFlag Binding.Mode.twoway;
                                       disabled: dataLogin.PrivacyPolicydisabled"
                                           onclick="AppBar.handleEvent('click', 'clickPrivacyPolicy', event)" />
                                    <span class="checkbox"
                                          data-win-res="{textContent: 'login.privacyPolicy'}"></span>
                                </label>
                                <span id="privacyPolicyLink"></span>
                            </div>
                            <details class="acc-advanced">
                                <summary data-win-res="{textContent: 'account.advanced'}"></summary>
                                <div class="acc-row">
                                    <label class="acc-row-title" data-win-res="{textContent: 'account.hostName'}"></label>
                                    <input class="win-textbox acc-input" type="text"
                                           data-win-bind="value: appSettings.odata.hostName Binding.Mode.twoway" />
                                </div>
                                <div class="acc-row">
                                    <span class="acc-row-title" data-win-res="{textContent: 'account.https'}"></span>
                                    <div class="toggle-switch-parent">
                                        <div id="https"
                                             data-win-control="WinJS.UI.ToggleSwitch"
                                             data-win-bind="winControl.checked: appSettings.odata.https; winControl.labelOn: generalData.on; winControl.labelOff: generalData.off"
                                             onchange="AppBar.handleEvent('change', 'clickHttps', event)">
                                        </div>
                                    </div>
                                </div>
                                <div class="acc-row">
                                    <label class="acc-row-title" data-win-res="{textContent: 'account.onlinePort'}"></label>
                                    <input class="win-textbox acc-input" type="text"
                                           data-win-bind="value: appSettings.odata.onlinePort Binding.Mode.twoway" />
                                </div>
                                <div class="acc-row">
                                    <label class="acc-row-title" data-win-res="{textContent: 'account.onlinePath'}"></label>
                                    <input class="win-textbox acc-input" type="text"
                                           data-win-bind="value: appSettings.odata.onlinePath Binding.Mode.twoway" />
                                </div>
                            </details>
                        </div>

                        <!-- Anmeldung und Sicherheit -->
                        <h3 class="acc-grp" data-win-res="{textContent: 'account.security'}"></h3>
                        <div id="tfa-container"></div>
                    </div>
                </div>
                <div class="error-message"
                     data-win-bind="style.display: error.displayErrorMsg; textContent: error.errorMsg"></div>
            </section>
        </div>
    </div>
</body>
</html>
